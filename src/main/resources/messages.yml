# Сообщения MiniMessage. Плейсхолдеры: <actor>, <target>, <value>, <command>, <verb> и т.д.
prefix: "<gradient:#54F46C:#03A469>[Отношения]</gradient> » "

verbs:
  propose:
    male: "сделал"
    female: "сделала"
    unknown: "сделал"
  hug:
    male: "обнял"
    female: "обняла"
    unknown: "обнял"
  kiss:
    male: "поцеловал"
    female: "поцеловала"
    unknown: "поцеловал"

